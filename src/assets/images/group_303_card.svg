<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <!-- Plastic Wrinkles Filter -->
    <filter id="cellophaneWrinkles" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.07" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lightingColor="#ffffff" surfaceScale="2.8" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Checkerboard Pattern Top & Bottom (2 rows of 45-deg rotated squares in #1D3F6D on #DBEE00) -->
    <pattern id="checkerPattern" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#1D3F6D" />
      <rect x="18" y="18" width="18" height="18" fill="#1D3F6D" />
      <rect x="18" y="0" width="18" height="18" fill="#DBEE00" />
      <rect x="0" y="18" width="18" height="18" fill="#DBEE00" />
    </pattern>

    <!-- Lime Gradient for Logo -->
    <linearGradient id="logoLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#E9FF1A" />
      <stop offset="70%" stopColor="#DBEE00" />
      <stop offset="100%" stopColor="#C4D600" />
    </linearGradient>

    <!-- Corner Gradients -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="40%" stopColor="#ffffff" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Outer Navy Blue Rounded Border #1D3F6D -->
  <rect width="600" height="840" rx="42" fill="#1D3F6D" />

  <!-- Inner Lime Card Core #DBEE00 -->
  <g transform="translate(24, 24)">
    <rect width="552" height="792" rx="30" fill="#DBEE00" />

    <!-- Cellophane Wrinkles Texture -->
    <rect width="552" height="792" rx="30" fill="#DBEE00" filter="url(#cellophaneWrinkles)" opacity="0.55" />

    <!-- Glossy Glare -->
    <rect width="552" height="792" rx="30" fill="url(#glareGrad)" pointer-events="none" />

    <!-- Top Checkerboard Banner -->
    <g transform="translate(0, 36)">
      <rect width="552" height="68" fill="url(#checkerPattern)" />
    </g>

    <!-- Bottom Checkerboard Banner -->
    <g transform="translate(0, 688)">
      <rect width="552" height="68" fill="url(#checkerPattern)" />
    </g>

    <!-- Center Questdex Bubble Logo -->
    <g transform="translate(276, 420)">
      <!-- Drop Shadow for Logo -->
      <g opacity="0.35" transform="translate(0, 8)">
        <text
          x="0"
          y="35"
          text-anchor="middle"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900"
          font-size="112"
          letter-spacing="-1px"
          fill="#000000"
          stroke="#000000"
          stroke-width="32"
          stroke-linejoin="round"
        >
          Questdex
        </text>
      </g>

      <!-- Black Bubble Stroke -->
      <text
        x="0"
        y="35"
        text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-weight="900"
        font-size="112"
        letter-spacing="-1px"
        fill="#000000"
        stroke="#000000"
        stroke-width="26"
        stroke-linejoin="round"
      >
        Questdex
      </text>

      <!-- Lime Bubble Fill -->
      <text
        x="0"
        y="35"
        text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-weight="900"
        font-size="112"
        letter-spacing="-1px"
        fill="url(#logoLime)"
        stroke="none"
      >
        Questdex
      </text>

      <!-- Glossy White Bubble Highlights -->
      <g fill="#FFFFFF" opacity="0.9">
        <!-- Q highlight -->
        <path d="M-195 -15 C-185 -30 -160 -36 -142 -32 C-152 -24 -170 -16 -180 -8 Z" />
        <ellipse cx="-202" cy="10" rx="5" ry="12" transform="rotate(-15 -202 10)" />
        <!-- u highlight -->
        <ellipse cx="-90" cy="-6" rx="4" ry="10" transform="rotate(-10 -90 -6)" />
        <!-- e highlight -->
        <path d="M-28 -18 C-18 -26 0 -26 12 -22 C0 -16 -12 -12 -24 -8 Z" />
        <!-- s highlight -->
        <path d="M48 -24 C60 -30 78 -28 88 -22 C76 -18 64 -14 54 -10 Z" />
        <!-- t highlight -->
        <ellipse cx="120" cy="-24" rx="4" ry="9" />
        <!-- d highlight -->
        <ellipse cx="10" cy="-6" rx="4" ry="9" />
        <!-- e 2 highlight -->
        <ellipse cx="70" cy="5" rx="3.5" ry="8" />
        <!-- x highlight -->
        <ellipse cx="178" cy="15" rx="4" ry="11" transform="rotate(25 178 15)" />
      </g>
    </g>
  </g>
</svg>
